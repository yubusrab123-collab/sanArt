                <button type="button" class="etiket-btn" onclick="etiketSec('manzara', 'Manzara', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Manzara</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('soyut', 'Soyut', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Soyut</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('heykel', 'Heykel', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Heykel</button>

                <button type="button" class="etiket-btn" onclick="etiketSec('fotograf', 'Fotoğrafçılık', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Fotoğrafçılık</button>
                <button type="button" class="etiket-df" onclick="etiketSec('diger', 'Diğer', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Diğer</button>

        <div style="background: #faf6f0; border: 2px solid #bfa487; padding: 15px; border-radius: 12px; max-width: 380px; width: 100%; position: relative;">

        <div style="background: #faf6f0; border: 2px solid #bfa487; padding: 30px 25px; border-radius: 12px; text-align: center; max-width: 340px; width: 90%; position: relative;">
            <span onclick="girisModaliniKapatGizli()" style="position: absolute; top: 10px; right: 15px; font-size: 18px; cursor: pointer; color: #7a6555; font-weight: bold;">✕</span>
            <span style="font-size: 35px;">🎨</span>
            <h3 style="color: #2c221e; margin: 10px 0 8px 0; font-size: 18px;">SanArt Dünyasına Katıl</h3>
            <p style="font-size: 13px; color: #7a6555; margin-bottom: 20px;">Eserleri beğenmek, takip etmek ve yorum yapmak için giriş yapmalısın!</p>
            <a href="profil.html" style="display: block; text-decoration: none;">
                <button style="background: #a65b32; color: white; width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;">Giriş Yap / Üye Ol</button>

    <script>
        let seciliEtiketFiltre = 'hepsi';
        let globalEserlerCache = [];

        window.onload = function() {
            let kayitliSoz = localStorage.getItem("sanart_haftanin_sozu");
            if(kayitliSoz) {
                document.getElementById('haftaninSozuMetin').innerText = kayitliSoz;
            }

            gonderileriYukle();
        };
// Firebase Auth ile aktif kullanıcı takibi ve Firestore'dan gerçek kullanıcı adını çekme
firebase.auth().onAuthStateChanged(async (user) => {
    let profilMetin = document.getElementById('altMenuProfilMetin');
    let profilHarf = document.getElementById('altMenuAvatarHarf');
    
    if (user) {
        let kAdiLocal = localStorage.getItem("sanart_kullanici");
        let kullaniciAdi = kAdiLocal && kAdiLocal !== "Misafir" ? kAdiLocal : "Sanatçı"; // E-posta fallback'i kaldırıldı
        
        try {
            let userDoc = await db.collection("users").doc(user.uid).get();
            if (userDoc.exists && userDoc.data().kullaniciAdi) {
                kullaniciAdi = userDoc.data().kullaniciAdi;
            }
        } catch (e) {
            console.error("Kullanıcı adı çekilemedi:", e);
        }

        // Aktif kullanıcıyı global değişkenlere ve localStorage'a sabitleyelim
        window.aktifKullaniciAdiGlobal = kullaniciAdi;
        localStorage.setItem("sanart_kullanici", kullaniciAdi);

        if(profilMetin) profilMetin.innerText = kullaniciAdi;
        if(profilHarf) profilHarf.innerText = kullaniciAdi.charAt(0).toUpperCase();

        if(kullaniciAdi === "yönetici" || kullaniciAdi === "sanart") {
            let yoneticiSoz = document.getElementById('yoneticiSozPaneli');
            if(yoneticiSoz) yoneticiSoz.style.display = 'block';
        }
    } else {
        window.aktifKullaniciAdiGlobal = "Misafir";
        localStorage.removeItem("sanart_kullanici");
        if(profilMetin) profilMetin.innerText = "Profil";
        if(profilHarf) profilHarf.innerText = "S";
    }
    
    gonderileriYukle();
});
      
        function haftaninSozunuGuncelle() {
            let yeniSoz = document.getElementById('yeniSozInput').value.trim();
            if(!yeniSoz) {
                alert("Lütfen bir söz yazın!");
                return;
            }
            localStorage.setItem("sanart_haftanin_sozu", yeniSoz);
            document.getElementById('haftaninSozuMetin').innerText = yeniSoz;
            document.getElementById('yeniSozInput').value = "";
            alert("Haftanın sözü güncellendi!");
        }

        function menuAcKapat() {
            var menu = document.getElementById('ucNoktaMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function girisModaliniKapatGizli() {
            document.getElementById('girisModal').style.display = 'none';
        }

        function etiketMenuAcKapat() {
            let liste = document.getElementById('etiketAcilirListe');
            let ok = document.getElementById('filtreOk');
            if (liste.style.display === 'flex') {
                liste.style.display = 'none';
                ok.style.transform = 'rotate(0deg)';
            } else {
                liste.style.display = 'flex';
                ok.style.transform = 'rotate(180deg)';
            }
        }

        function etiketSec(etiketKodu, etiketGorunenAd, btnElement) {
            seciliEtiketFiltre = etiketKodu;
            document.getElementById('seciliEtiketGosterge').innerText = etiketGorunenAd;
            
            let butonlar = document.querySelectorAll('.etiket-btn');
            butonlar.forEach(b => {
                b.style.background = '#faf6f0';
                b.style.color = '#2c221e';
            });
            btnElement.style.background = '#a65b32';
            btnElement.style.color = '#fff';

            document.getElementById('etiketAcilirListe').style.display = 'none';
            document.getElementById('filtreOk').style.transform = 'rotate(0deg)';
            gonderileriYukle();
        }

        // FIRESTORE ENTEGRASYONLU GÖNDERİLERİ YÜKLE FONKSİYONU
      // FIRESTORE ENTEGRASYONLU GÖNDERİLERİ YÜKLE FONKSİYONU
        async function gonderileriYukle() {
            let listeDiv = document.getElementById('gonderiListesi');
            let aramaKutusuEl = document.getElementById('aramaKutusu');
            let aramaMetni = aramaKutusuEl ? aramaKutusuEl.value.toLowerCase().trim() : "";
            
            globalEserlerCache = [];

            try {
                let snapshot = await db.collection("eserler").get();
                snapshot.forEach(docSnap => {
                    globalEserlerCache.push({ id: docSnap.id, ...docSnap.data() });
                });
            } catch (err) {
                console.error("Firebase'den veriler çekilirken hata oluştu:", err);
                listeDiv.innerHTML = `<p style="text-align:center; color: #d9534f; font-style: italic;">Eserler yüklenirken bir bağlantı hatası oluştu.</p>`;
                return;
            }

            let eserler = globalEserlerCache;

            eserler.sort((a, b) => {
                let tA = a.tarihMs && a.tarihMs.toMillis ? a.tarihMs.toMillis() : (a.tarihMs || 0);
                let tB = b.tarihMs && b.tarihMs.toMillis ? b.tarihMs.toMillis() : (b.tarihMs || 0);
                
                if (tA === 0 && a.tarih) {
                    let parsed = Date.parse(a.tarih);
                    if (!isNaN(parsed)) tA = parsed;
                }
                if (tB === 0 && b.tarih) {
                    let parsed = Date.parse(b.tarih);
                    if (!isNaN(parsed)) tB = parsed;
                }
                
                return tB - tA;
            });

            listeDiv.innerHTML = "";

            let filtrelenmis = eserler.filter(eser => {
                let baslikUyuyor = (eser.baslik || "").toLowerCase().includes(aramaMetni);
                let yazarUyuyor = (eser.yazar || "").toLowerCase().includes(aramaMetni);
                let etiketUyuyor = (eser.etiket || "").toLowerCase().includes(aramaMetni);
                let aramaEslesmesi = !aramaMetni || baslikUyuyor || yazarUyuyor || etiketUyuyor;

                let etiketEslesmesi = (seciliEtiketFiltre === 'hepsi' || (eser.etiket && eser.etiket.toLowerCase() === seciliEtiketFiltre.toLowerCase()));

                return aramaEslesmesi && etiketEslesmesi;
            });

            if (filtrelenmis.length === 0) {
                listeDiv.innerHTML = `<p style="text-align:center; color: #7a6555; font-style: italic;">Aradığınız kriterlere uygun eser bulunamadı.</p>`;
                return;
            }

            for (const eser of filtrelenmis) {
                let currentUser = firebase.auth().currentUser;
                let aktifKullanici = window.aktifKullaniciAdiGlobal || localStorage.getItem("sanart_kullanici") || (currentUser ? currentUser.displayName : "Misafir");
                let eserYazari = eser.yazar || "Sanatçı";
                let eserAvatar = localStorage.getItem("sanart_avatar_" + eserYazari) || "";
                let begenenler = eser.begenenler || [];
                let begenildiMi = begenenler.includes(aktifKullanici);

                let takipEdiliyorMu = false;
                if (aktifKullanici !== "Misafir" && aktifKullanici !== eserYazari) {
                    let kontrolSnap = await db.collection("takipler")
                        .where("takipEden", "==", aktifKullanici)
                        .where("takipEdilen", "==", eserYazari)
                        .get();
                    takipEdiliyorMu = !kontrolSnap.empty;
                }

                let kart = document.createElement('div');
                kart.className = 'card gonderi-karti';
                kart.style.cssText = "background: #faf6f0; border: 1.5px solid #bfa487; border-radius: 8px; padding: 12px; margin-bottom: 20px;";

                let yazarHarf = eserYazari.charAt(0).toUpperCase();
                let profilFotoHTML = eserAvatar && eserAvatar.startsWith('data:image') ? 
                    `<div onclick="kullaniciProfiliAc('${eserYazari}')" style="width: 32px; height: 32px; border-radius: 50%; background-image: url('${eserAvatar}'); background-size: cover; background-position: center; cursor: pointer;"></div>` :
                    `<div onclick="kullaniciProfiliAc('${eserYazari}')" style="width: 32px; height: 32px; border-radius: 50%; background: #a65b32; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; cursor: pointer;">${yazarHarf}</div>`;

                let takipBtnHTML = "";
                if(aktifKullanici !== "Misafir" && aktifKullanici !== eserYazari) {
                    let btnText = takipEdiliyorMu ? 'Takip Ediliyor' : 'Takip Et';
                    let btnBg = takipEdiliyorMu ? '#7a6555' : '#a65b32';
                    let guvenliYazar = eserYazari.replace(/['"\\]/g, '');
                    takipBtnHTML = `<button class="takip-btn-${guvenliYazar}" onclick="takipEtDegistir('${guvenliYazar}', this)" style="background: ${btnBg}; color: white; border: none; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold;">${btnText}</button>`;
                }

                let yoneticiSilBtn = (aktifKullanici === "yönetici" || aktifKullanici === eserYazari) ? 
                    `<button onclick="yoneticiEserSil('${eser.id}')" style="background: transparent; border: none; color: #d9534f; font-size: 11px; cursor: pointer; font-weight: bold;" title="Eseri Sil">🗑️ Sil</button>` : "";

                let gorselHTML = eser.gorsel ? 
                    `<div style="width: 100%; background: #f0ebe1; border-radius: 6px; overflow: hidden; border: 1px solid #bfa487; margin-top: 8px;"><img src="${eser.gorsel}" style="width: 100%; display: block;" onclick="eserDetayGoster('${eser.id}')"></div>` : "";

                let yorumlarHTML = "";
                if (eser.yorumlar && eser.yorumlar.length > 0) {
                    eser.yorumlar.forEach(y => {
                        yorumlarHTML += `<div style="font-size: 12px; color: #7a6555; margin-bottom: 4px;"><strong>${y.yazar}:</strong> ${y.metin}</div>`;
                    });
                } else {
                    yorumlarHTML = `<p style="font-size: 12px; color: #a08c7d; font-style: italic;">Henüz yorum yapılmamış.</p>`;
                }

                kart.innerHTML = `

     async function kullaniciProfiliAc(kisiAdi) {
    document.getElementById('listeDetayModal').style.display = 'none';
    let currentUser = firebase.auth().currentUser;
    let aktifKullanici = window.aktifKullaniciAdiGlobal || localStorage.getItem("sanart_kullanici");
    let eserler = globalEserlerCache;
    let kullaniciEserleri = eserler.filter(e => e.yazar === kisiAdi);

    let toplamBegeni = 0;
    kullaniciEserleri.forEach(e => {
        if(e.begenenler) toplamBegeni += e.begenenler.length;
    });

    // 3. Sorun Çözümü: Gizlilik ve avatar ayarlarını doğrudan Firestore 'users' koleksiyonundan çekiyoruz
    let userQuery = await db.collection("users").where("kullaniciAdi", "==", kisiAdi).get();
    let userData = !userQuery.empty ? userQuery.docs[0].data() : {};
    let gizlilikAyarlari = userData.gizlilik || {};
    let avatar = userData.avatar || "";

    // 1 ve 2. Sorun Çözümü: Takipçi ve takip edilen sayılarını doğrudan Firestore 'takipler' koleksiyonundan hesaplıyoruz
    let takipciSnap = await db.collection("takipler").where("takipEdilen", "==", kisiAdi).get();
    let takipciler = [];
    takipciSnap.forEach(doc => takipciler.push(doc.data().takipEden));

    let takipEdilenSnap = await db.collection("takipler").where("takipEden", "==", kisiAdi).get();
    let takipEdilenler = [];
    takipEdilenSnap.forEach(doc => takipEdilenler.push(doc.data().takipEdilen));

    // Aktif kullanıcının bu profili takip edip etmediğini Firestore'dan sorgula
    let takipEdiliyorMu = false;
    if (aktifKullanici && aktifKullanici !== "Misafir" && aktifKullanici !== kisiAdi) {
        let kontrolSnap = await db.collection("takipler")
            .where("takipEden", "==", aktifKullanici)
            .where("takipEdilen", "==", kisiAdi)
            .get();
        takipEdiliyorMu = !kontrolSnap.empty;
    }

    let modalIcerik = document.getElementById('profilModalIcerik');
    let avatarHTML = avatar ?
        `<div style="width: 60px; height: 60px; border-radius: 50%; background-image: url('${avatar}'); background-size: cover; background-position: center; margin: 0 auto 8px auto;"></div>` :
        `<div style="width: 60px; height: 60px; border-radius: 50%; background: #a65b32; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin: 0 auto 8px auto;">${kisiAdi.charAt(0).toUpperCase()}</div>`;

    let takipBtnModal = "";
    if(aktifKullanici !== "Misafir" && aktifKullanici !== kisiAdi) {
        let btnText = takipEdiliyorMu ? 'Takip Ediliyor' : 'Takip Et';
        let btnBg = takipEdiliyorMu ? '#7a6555' : '#a65b32';
        let guvenliKisiAdi = kisiAdi.replace(/['"\\]/g, '');
        takipBtnModal = `<button class="takip-btn-${guvenliKisiAdi}" onclick="takipEtDegistir('${guvenliKisiAdi}', this)" style="background: ${btnBg}; color: white; border: none; padding: 6px 16px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; font-weight: bold; display: block; margin-left: auto; margin-right: auto;">${btnText}</button>`;
    }

    // Gizlilik ayarlarına göre istatistik kutularını gizleme
    let istatistikHTML = `<div style="display: flex; justify-content: space-around; background: #f0ebe1; padding: 8px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #bfa487; font-size: 12px;">`;
    
    if (!gizlilikAyarlari.eser) {
        istatistikHTML += `<div><strong>${kullaniciEserleri.length}</strong><br><span style="font-size: 10px; color: #7a6555;">Eser</span></div>`;
    }
    if (!gizlilikAyarlari.begeni) {
        istatistikHTML += `<div><strong>${toplamBegeni}</strong><br><span style="font-size: 10px; color: #7a6555;">Beğeni</span></div>`;
    }
    if (!gizlilikAyarlari.takipci) {
        let takipciJsonStr = JSON.stringify(takipciler).replace(/"/g, '&quot;');
        istatistikHTML += `<div onclick='listeGoster("Takipçiler", ${takipciJsonStr}, ${gizlilikAyarlari.takipci || false})' style="cursor: pointer;"><strong>${takipciler.length}</strong><br><span style="font-size: 10px; color: #a65b32; text-decoration: underline;">Takipçi</span></div>`;
    }
    if (!gizlilikAyarlari.takip) {
        let takipEdilenJsonStr = JSON.stringify(takipEdilenler).replace(/"/g, '&quot;');
        istatistikHTML += `<div onclick='listeGoster("Takip Edilenler", ${takipEdilenJsonStr}, ${gizlilikAyarlari.takip || false})' style="cursor: pointer;"><strong>${takipEdilenler.length}</strong><br><span style="font-size: 10px; color: #a65b32; text-decoration: underline;">Takip</span></div>`;
    }
    istatistikHTML += `</div>`;

    let eserlerGridHTML = "";
    if(!gizlilikAyarlari.eser) {
        if(kullaniciEserleri.length > 0) {
            kullaniciEserleri.forEach(e => {
                if(e.gorsel) {
                    eserlerGridHTML += `<img src="${e.gorsel}" onclick="eserDetayGoster('${e.id}')" style="width: 100%; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #bfa487; cursor: pointer;">`;
                }
            });
        } else {
            eserlerGridHTML = `<p style="grid-column: span 3; font-size: 11px; color: #7a6555; font-style: italic; text-align: center;">Henüz eser paylaşmamış.</p>`;
        }
    } else {
        eserlerGridHTML = `<p style="grid-column: span 3; font-size: 11px; color: #7a6555; font-style: italic; text-align: center;">Bu kullanıcının eserleri gizli.</p>`;
    }

    modalIcerik.innerHTML = `
        <div style="text-align: center;">
            ${avatarHTML}
            <h3 style="color: #2c221e; margin-bottom: 4px; font-size: 15px;">${kisiAdi}</h3>
            ${takipBtnModal}
            ${istatistikHTML}
            <h4 style="font-size: 12px; color: #2b2201; margin-bottom: 6px; text-align: left;">Paylaştığı Eserler:</h4>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 180px; overflow-y: auto;">
                ${eserlerGridHTML}
            </div>
        </div>
    `;

    document.getElementById('profilDetayModal').style.display = 'flex';
}

        async function begeniDegistirModal(element, eserId) {
            let currentUser = firebase.auth().currentUser;
            let kullanici = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : localStorage.getItem("sanart_kullanici");
            if (!kullanici || kullanici === "Misafir") {
                document.getElementById('girisModal').style.display = 'flex';
                return;
            }
            let eserler = globalEserlerCache;
            let eser = eserler.find(e => String(e.id) === String(eserId));
            if (!eser) return;

            if (!eser.begenenler) eser.begenenler = [];
            let userIndex = eser.begenenler.indexOf(kullanici);
            let sayiElementi = element.closest('#eserDetayModal').querySelector('.begeni-sayisi-modal');

            if (userIndex > -1) {
                eser.begenenler.splice(userIndex, 1);
                element.innerText = "🤍";
            } else {
                eser.begenenler.push(kullanici);
                element.innerText = "❤️";
            }
            sayiElementi.innerText = eser.begenenler.length;
            
            try {
                await db.collection("eserler").doc(eserId).update({ begenenler: eser.begenenler });
            } catch(e) { console.error(e); }
            gonderileriYukle();
        }

        async function modalYorumYap(eserId) {
            let currentUser = firebase.auth().currentUser;
            let kullanici = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : localStorage.getItem("sanart_kullanici");
            if (!kullanici || kullanici === "Misafir") {
                document.getElementById('girisModal').style.display = 'flex';
                return;
            }
            let input = document.getElementById('modalYorumInput');
            let metin = input.value.trim();
            if(!metin) return;

            let eserler = globalEserlerCache;
            let eser = eserler.find(e => String(e.id) === String(eserId));
            if(!eser) return;

            if(!eser.yorumlar) eser.yorumlar = [];
            eser.yorumlar.push({ yazar: kullanici, metin: metin });
            
            try {
                await db.collection("eserler").doc(eserId).update({ yorumlar: eser.yorumlar });
            } catch(e) { console.error(e); }

            eserDetayGoster(eserId);
            gonderileriYukle();
        }

        async function takipEtDegistir(sanatciAdi, btnElement) {
    let currentUser = firebase.auth().currentUser;
    let aktifKullanici = window.aktifKullaniciAdiGlobal || localStorage.getItem("sanart_kullanici");
    if (!aktifKullanici || aktifKullanici === "Misafir") {
        document.getElementById('girisModal').style.display = 'flex';
        return;
    }

    try {
        let takipRef = db.collection("takipler");
        // Firestore'da bu takip ilişkisi var mı kontrol et
        let kontrolSnap = await takipRef
            .where("takipEden", "==", aktifKullanici)
            .where("takipEdilen", "==", sanatciAdi)
            .get();

        let yeniDurum = false;
        if (!kontrolSnap.empty) {
            // İlişki varsa sil (Takipten çık)
            let docId = kontrolSnap.docs[0].id;
            await takipRef.doc(docId).delete();
            yeniDurum = false;
        } else {
            // İlişki yoksa ekle (Takip et)
            await takipRef.add({
                takipEden: aktifKullanici,
                takipEdilen: sanatciAdi,
                tarih: firebase.firestore.FieldValue.serverTimestamp()
            });
            yeniDurum = true;
        }

        // Sayfadaki tüm ilgili takip butonlarını anında güncelle
        let ilgiliButonlar = document.querySelectorAll('.takip-btn-' + CSS.escape(sanatciAdi));
        ilgiliButonlar.forEach(btn => {
            btn.innerText = yeniDurum ? "Takip Ediliyor" : "Takip Et";
            btn.style.background = yeniDurum ? "#7a6555" : "#a65b32";
        });

       if(btnElement) {
            btnElement.innerText = yeniDurum ? "Takip Ediliyor" : "Takip Et";
            btnElement.style.background = yeniDurum ? "#7a6555" : "#a65b32";
        }

        // Eğer kullanıcı profil modalı açıksa, sayacın güncellenmesi için profili yeniden yükle
        let profilModal = document.getElementById('profilDetayModal');
        if (profilModal && profilModal.style.display === 'flex') {
            // Hangi profilde olduğumuzu başlık veya global değişkenden bulup yeniden açabiliriz
            // Veya doğrudan ilgili kullanıcının adını parametre olarak geçirebilirsin.
        }
    } catch (e) {
        console.error("Takip işlemi hatası:", e);
    }
}
