<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanArt - Keşfet Akışı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body style="padding-bottom: 70px;">

    <!-- ÜST BAŞLIK VE MENÜ -->
    <header class="site-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="logo-container" style="display: flex; align-items: center; gap: 10px;">
            <img src="logo.jpg" alt="SanArt Logo">
            <h1>SanArt Keşfet</h1>
        </div>
        <div style="position: relative;">
            <button onclick="menuAcKapat()" style="background: none; border: none; font-size: 24px; cursor: pointer; color:  #2b2201; padding: 0 5px;" title="Seçenekler">⋮</button>
            <div id="ucNoktaMenu" style="display: none; position: absolute; right: 0; top: 35px; background: #faf6f0; border: 2px solid #bfa487; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); width: 130px; z-index: 1000; text-align: left;">
                <a href="hakkinda.html" style="display: block; padding: 10px; font-size: 12px; color: #2c221e; text-decoration: none; border-bottom: 1px solid #e6d7c3;">Hakkımızda</a>
                <a href="iletisim.html" style="display: block; padding: 10px; font-size: 12px; color: #2c221e; text-decoration: none;">İletişim</a>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 500px; margin: 0 auto; padding: 15px;">
        
        <!-- HAFTANIN SÖZÜ -->
        <div style="background: linear-gradient(135deg, #faf6f0 0%, #f0ebe1 100%); border: 6px solid   #bfa487   ; border-radius: 12px; padding: 16px 20px; margin-bottom: 15px; text-align: center; position: relative; box-shadow: 0 4px 12px rgba(166, 91, 50, 0.08);">
            <div style="font-size: 18px; color: #a65b32; margin-bottom: 1px; line-height: 0.5;"></div>
            <h3 style="font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #a65b32; margin-bottom: 8px; font-weight: bold;">✨​Haftanın Sözü✨​</h3>
            <p id="haftaninSozuMetin" style="font-size: 13px; color: #2c221e; font-style: italic; line-height: 1.4; font-family: 'Georgia', serif;">"Sanat, ruhu günlük hayatın tozundan temizler." – Pablo Picasso</p>
            <div style="font-size: 18px; color: #a65b32; margin-top: 4px; line-height: 1;"></div>
            
            <div id="yoneticiSozPaneli" style="display: none; margin-top: 12px; border-top: 1px dashed #bfa487; padding-top: 10px;">
                <input type="text" id="yeniSozInput" placeholder="Yeni haftanın sözünü yazın..." style="width: 100%; padding: 6px; font-size: 11px; border: 1px solid #bfa487; border-radius: 4px; box-sizing: border-box; margin-bottom: 6px; font-family: 'Georgia', serif;">
                <button onclick="haftaninSozunuGuncelle()" style="background:#6a5444; color: white; border: none; padding: 5px 12px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold;">Sözü Güncelle</button>
            </div>
        </div>
<br><br><br>
        <!-- UZATILMIŞ ARAMA BARI -->
        <div style="display: flex; gap: 6px; margin-bottom: 8px; align-items: center;">
            <input type="text" id="aramaKutusu" placeholder="" style="flex: 1; padding: 0.5px; font-family: 'Georgia', serif; border: 1.5px solid #bfa487; border-radius: 6px; font-size: 35px; background: #faf6f0; box-sizing: border-box;">
            <button onclick="gonderileriYukle()" style="background: #ded6c2; color: white; border: none; padding: 16px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;" title="Ara">🔍</button>
        </div>

        <!-- FİLTRELEME BÖLÜMÜ -->
        <div style="border-radius: 8px; padding: 0; margin-bottom: 15px; position: relative;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">
                <div onclick="etiketMenuAcKapat()" style="display: flex; align-items: center; justify-content: space-between; flex: 1; background: #fff; border: 1px solid #bfa487; padding: 6px 171px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #2c221e; font-weight: bold;">
                    <span id="seciliEtiketGosterge">Tümü</span>
                    <span id="filtreOk" style="font-size: 10px; color: #ded6c2; transition: transform 0.2s;">▼</span>
                </div>
                <button onclick="gonderileriYukle()" style="background: #ded6c2; color: rgb(0, 0, 0); border: none; padding: 6px 12px; font-size: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap;">Filtrele</button>
            </div>

            <div id="etiketAcilirListe" style="display: none; margin-top: 8px; border-top: 1px dashed #bfa487; padding-top: 8px; flex-wrap: wrap; gap: 5px;">
                <button type="button" class="etiket-btn" onclick="etiketSec('hepsi', 'Tümü', this)" style="background: #ded6c2; color: #000000; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Tümü</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('ankara', 'Ankara', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Ankara</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('doğa', 'Doğa', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Doğa</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('istanbul', 'İstanbul', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">İstanbul</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('portre', 'Portre', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Portre</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('manzara', 'Manzara', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Manzara</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('soyut', 'Soyut', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Soyut</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('heykel', 'Heykel', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Heykel</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('mimari', 'Mimari', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Mimari</button>
                <button type="button" class="etiket-btn" onclick="etiketSec('fotograf', 'Fotoğrafçılık', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Fotoğrafçılık</button>
                <button type="button" class="etiket-df" onclick="etiketSec('diger', 'Diğer', this)" style="background: #faf6f0; color: #2c221e; border: 1px solid #bfa487; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;">Diğer</button>
            </div>
        </div>

        <div id="gonderiListesi"></div>
    </div>

    <!-- KULLANICI PROFİL DETAY MODALI -->
    <div id="profilDetayModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 34, 30, 0.85); z-index: 9999; align-items: center; justify-content: center; overflow-y: auto;">
        <div style="background: #faf6f0; border: 2px solid #bfa487; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; text-align: left;">
            <span onclick="profilModaliniKapat()" style="position: absolute; top: 10px; right: 15px; font-size: 18px; cursor: pointer; color: #7a6555; font-weight: bold;">✕</span>
            <div id="profilModalIcerik"></div>
        </div>
    </div>

    <!-- LİSTE DETAY MODALI -->
    <div id="listeDetayModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 34, 30, 0.85); z-index: 10000; align-items: center; justify-content: center;">
        <div style="background: #faf6f0; border: 2px solid #bfa487; padding: 20px; border-radius: 12px; max-width: 320px; width: 85%; max-height: 60vh; overflow-y: auto; position: relative;">
            <span onclick="document.getElementById('listeDetayModal').style.display='none'" style="position: absolute; top: 10px; right: 15px; font-size: 18px; cursor: pointer; color: #7a6555; font-weight: bold;">✕</span>
            <h4 id="listeBaslik" style="color: #a65b32; margin-bottom: 10px; font-size: 14px;"></h4>
            <div id="listeIcerikAlani" style="display: grid; gap: 8px;"></div>
        </div>
    </div>

    <!-- ESER DETAY MODALI -->
    <div id="eserDetayModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 34, 30, 0.9); z-index: 10500; align-items: center; justify-content: center; overflow-y: auto; padding: 15px;">
        <div style="background: #faf6f0; border: 2px solid #bfa487; padding: 15px; border-radius: 12px; max-width: 380px; width: 100%; position: relative;">
            <span onclick="document.getElementById('eserDetayModal').style.display='none'" style="position: absolute; top: 10px; right: 15px; font-size: 18px; cursor: pointer; color: #7a6555; font-weight: bold;">✕</span>
            <div id="eserDetayIcerik"></div>
        </div>
    </div>

    <!-- GİRİŞ YAP UYARI MODALI -->
    <div id="girisModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 34, 30, 0.85); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: #faf6f0; border: 2px solid #bfa487; padding: 30px 25px; border-radius: 12px; text-align: center; max-width: 340px; width: 90%; position: relative;">
            <span onclick="girisModaliniKapatGizli()" style="position: absolute; top: 10px; right: 15px; font-size: 18px; cursor: pointer; color: #7a6555; font-weight: bold;">✕</span>
            <span style="font-size: 35px;">🎨</span>
            <h3 style="color: #2c221e; margin: 10px 0 8px 0; font-size: 18px;">SanArt Dünyasına Katıl</h3>
            <p style="font-size: 13px; color: #7a6555; margin-bottom: 20px;">Eserleri beğenmek, takip etmek ve yorum yapmak için giriş yapmalısın!</p>
            <a href="profil.html" style="display: block; text-decoration: none;">
                <button style="background: #a65b32; color: white; width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;">Giriş Yap / Üye Ol</button>
            </a>
        </div>
    </div>

    <script>
        let seciliEtiketFiltre = 'hepsi';

        window.onload = function() {
            let aktifKullanici = localStorage.getItem("sanart_kullanici");
            let profilMetin = document.getElementById('altMenuProfilMetin');
            let profilHarf = document.getElementById('altMenuAvatarHarf');
            if (aktifKullanici && aktifKullanici !== "Misafir") {
                if(profilMetin) profilMetin.innerText = aktifKullanici;
                if(profilHarf) profilHarf.innerText = aktifKullanici.charAt(0).toUpperCase();
                
                if(aktifKullanici === "yönetici" || aktifKullanici === "sanart") {
                    document.getElementById('yoneticiSozPaneli').style.display = 'block';
                }
            }

            let kayitliSoz = localStorage.getItem("sanart_haftanin_sozu");
            if(kayitliSoz) {
                document.getElementById('haftaninSozuMetin').innerText = kayitliSoz;
            }

            gonderileriYukle();
        };

        function haftaninSozunuGuncelle() {
            let yeniSoz = document.getElementById('yeniSozInput').value.trim();
            if(!yeniSoz) {
                alert("Lütfen bir söz yazın!");
                return;
            }
            localStorage.setItem("sanart_haftanin_sozu", yeniSoz);
            document.getElementById('haftaninSozuMetin').innerText = yeniSoz;
            document.getElementById('yeniSozInput').value = "";
            alert("Haftanın sözü güncellendi!");
        }

        function menuAcKapat() {
            var menu = document.getElementById('ucNoktaMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function girisModaliniKapatGizli() {
            document.getElementById('girisModal').style.display = 'none';
        }

        function etiketMenuAcKapat() {
            let liste = document.getElementById('etiketAcilirListe');
            let ok = document.getElementById('filtreOk');
            if (liste.style.display === 'flex') {
                liste.style.display = 'none';
                ok.style.transform = 'rotate(0deg)';
            } else {
                liste.style.display = 'flex';
                ok.style.transform = 'rotate(180deg)';
            }
        }

        function etiketSec(etiketKodu, etiketGorunenAd, btnElement) {
            seciliEtiketFiltre = etiketKodu;
            document.getElementById('seciliEtiketGosterge').innerText = etiketGorunenAd;
            
            let butonlar = document.querySelectorAll('.etiket-btn');
            butonlar.forEach(b => {
                b.style.background = '#faf6f0';
                b.style.color = '#2c221e';
            });
            btnElement.style.background = '#a65b32';
            btnElement.style.color = '#fff';

            document.getElementById('etiketAcilirListe').style.display = 'none';
            document.getElementById('filtreOk').style.transform = 'rotate(0deg)';
        }

        function gonderileriYukle() {
            let listeDiv = document.getElementById('gonderiListesi');
            let aramaMetni = document.getElementById('aramaKutusu').value.toLowerCase().trim();
            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let tersEserler = [...eserler].reverse();

            listeDiv.innerHTML = "";

            let filtrelenmis = tersEserler.filter(eser => {
                let baslikUyuyor = (eser.baslik || "").toLowerCase().includes(aramaMetni);
                let yazarUyuyor = (eser.yazar || "").toLowerCase().includes(aramaMetni);
                let etiketUyuyor = (eser.etiket || "").toLowerCase().includes(aramaMetni);
                let aramaEslesmesi = !aramaMetni || baslikUyuyor || yazarUyuyor || etiketUyuyor;

                let etiketEslesmesi = (seciliEtiketFiltre === 'hepsi' || (eser.etiket && eser.etiket.toLowerCase() === seciliEtiketFiltre.toLowerCase()));

                return aramaEslesmesi && etiketEslesmesi;
            });

            if (filtrelenmis.length === 0) {
                listeDiv.innerHTML = `<p style="text-align:center; color: #ded6c2; font-style: italic;">Aradığınız kriterlere uygun eser bulunamadı.</p>`;
                return;
            }

            filtrelenmis.forEach((eser) => {
                let aktifKullanici = localStorage.getItem("sanart_kullanici") || "Misafir";
                let eserYazari = eser.yazar || "Sanatçı";
                let eserAvatar = localStorage.getItem("sanart_avatar_" + eserYazari) || "";
                let begenenler = eser.begenenler || [];
                let begenildiMi = begenenler.includes(aktifKullanici);

                let takipEdilenler = JSON.parse(localStorage.getItem("sanart_takip_edilenler_" + aktifKullanici) || "[]");
                let takipEdiliyorMu = takipEdilenler.includes(eserYazari);

                let kart = document.createElement('div');
                kart.className = 'card gonderi-karti';
                kart.style.cssText = "background: #faf6f0; border: 1.5px solid #bfa487; border-radius: 8px; padding: 12px; margin-bottom: 20px;";

                let yazarHarf = eserYazari.charAt(0).toUpperCase();
                let profilFotoHTML = eserAvatar && eserAvatar.startsWith('data:image') ? 
                    `<div onclick="kullaniciProfiliAc('${eserYazari}')" style="width: 32px; height: 32px; border-radius: 50%; background-image: url('${eserAvatar}'); background-size: cover; background-position: center; cursor: pointer;"></div>` :
                    `<div onclick="kullaniciProfiliAc('${eserYazari}')" style="width: 32px; height: 32px; border-radius: 50%; background: #a65b32; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; cursor: pointer;">${yazarHarf}</div>`;

                let takipBtnHTML = "";
                if (aktifKullanici !== "Misafir" && aktifKullanici !== eserYazari) {
                    let btnText = takipEdiliyorMu ? 'Takip Ediliyor' : 'Takip Et';
                    let btnBg = takipEdiliyorMu ? '#7a6555' : '#a65b32';
                    takipBtnHTML = `<button class="takip-btn-${eserYazari}" onclick="takipEtDegistir('${eserYazari}', this)" style="background: ${btnBg}; color: white; border: none; padding: 3px 8px; font-size: 10px; border-radius: 4px; cursor: pointer;">${btnText}</button>`;
                }

                let yoneticiSilBtn = (aktifKullanici === "yönetici" || aktifKullanici === eserYazari) ? 
                    `<button onclick="yoneticiEserSil('${eser.id}')" style="background: transparent; border: none; color: #d9534f; font-size: 11px; cursor: pointer; font-weight: bold;" title="Eseri Sil">🗑️ Sil</button>` : "";

                let gorselHTML = eser.gorsel ? 
                    `<div style="width: 100%; background: #f0ebe1; border-radius: 6px; overflow: hidden; border: 1px solid #bfa487; margin-top: 8px;"><img src="${eser.gorsel}" style="width: 100%; display: block;"></div>` : "";

                let yorumlarHTML = "";
                if (eser.yorumlar && eser.yorumlar.length > 0) {
                    eser.yorumlar.forEach(y => {
                        yorumlarHTML += `<div style="font-size: 12px; color: #7a6555; margin-bottom: 4px;"><strong>${y.yazar}:</strong> ${y.metin}</div>`;
                    });
                } else {
                    yorumlarHTML = `<p style="font-size: 12px; color: #a08c7d; font-style: italic;">Henüz yorum yapılmamış.</p>`;
                }

                kart.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            ${profilFotoHTML}
                            <span onclick="kullaniciProfiliAc('${eserYazari}')" style="font-size: 13px; font-weight: bold; color: #2c221e; cursor: pointer;">${eserYazari}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            ${takipBtnHTML}
                            ${yoneticiSilBtn}
                        </div>
                    </div>
                    ${gorselHTML}
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-bottom: 1px solid #eae0d0; padding-bottom: 6px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <span style="cursor: pointer; font-size: 18px;" onclick="begeniDegistir(this, '${eser.id}')">${begenildiMi ? '❤️' : '🤍'}</span>
                                <strong class="begeni-sayisi" style="font-size: 12px; color: #2c221e;">${begenenler.length}</strong>
                            </div>
                            <div style="display: flex; align-items: center; gap: 4px; cursor: pointer;" onclick="yorumlariAcKapat(this)">
                                <span style="font-size: 18px;">💬</span>
                                <strong style="font-size: 12px; color: #2c221e;">${eser.yorumlar ? eser.yorumlar.length : 0}</strong>
                            </div>
                        </div>
                        <span style="font-size: 11px; color: #7a6555;">${eser.tarih || 'Bugün'}</span>
                    </div>
                    <p style="font-size: 13px; margin-top: 8px; color: #2c221e; text-align: left;">
                        <strong>${eser.baslik || ''}</strong> ${eser.aciklama ? '- ' + eser.aciklama : ''} <span style="color: #a65b32; font-weight: bold;">#${eser.etiket || 'diğer'}</span>
                    </p>
                    <div class="yorum-alani" style="display: none; margin-top: 10px; border-top: 1.5px dashed #bfa487; padding-top: 6px; text-align: left;">
                        <div class="yorumlar-listesi">${yorumlarHTML}</div>
                        <div style="display: flex; gap: 5px; margin-top: 6px;">
                            <input type="text" class="yorum-input" placeholder="Yorum yaz..." style="flex: 1; padding: 5px; font-size: 12px; border: 1px solid #bfa487; border-radius: 4px; font-family: 'Georgia', serif;">
                            <button onclick="yorumYap(this, '${eser.id}')" style="padding: 5px 10px; margin: 0; width: auto; font-size: 11px; background: #a65b32; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Paylaş</button>
                        </div>
                    </div>
                `;
                listeDiv.appendChild(kart);
            });
        }

        function kullaniciProfiliAc(kisiAdi) {
            document.getElementById('listeDetayModal').style.display = 'none';
            let aktifKullanici = localStorage.getItem("sanart_kullanici") || "Misafir";
            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let kullaniciEserleri = eserler.filter(e => e.yazar === kisiAdi);

            let toplamBegeni = 0;
            kullaniciEserleri.forEach(e => {
                if(e.begenenler) toplamBegeni += e.begenenler.length;
            });

            let takipciler = [];
            let tumKullanicilar = [kisiAdi];
            eserler.forEach(e => { if(e.yazar && !tumKullanicilar.includes(e.yazar)) tumKullanicilar.push(e.yazar); });
            
            for(let i=0; i<localStorage.length; i++) {
                let keyName = localStorage.key(i);
                if(keyName.startsWith("sanart_takip_edilenler_")) {
                    let kAdi = keyName.replace("sanart_takip_edilenler_", "");
                    if(!tumKullanicilar.includes(kAdi)) tumKullanicilar.push(kAdi);
                }
            }

            tumKullanicilar.forEach(k => {
                let kTakipEdilen = JSON.parse(localStorage.getItem("sanart_takip_edilenler_" + k) || "[]");
                if(kTakipEdilen.includes(kisiAdi)) {
                    if(!takipciler.includes(k)) takipciler.push(k);
                }
            });

            let takipEdilenler = JSON.parse(localStorage.getItem("sanart_takip_edilenler_" + kisiAdi) || "[]");
            let avatar = localStorage.getItem("sanart_avatar_" + kisiAdi) || "";
            let gizlilikAyarlari = JSON.parse(localStorage.getItem("sanart_gizlilik_" + kisiAdi) || "{}");
            
            let modalIcerik = document.getElementById('profilModalIcerik');
            let avatarHTML = avatar && avatar.startsWith('data:image') ?
                `<div style="width: 60px; height: 60px; border-radius: 50%; background-image: url('${avatar}'); background-size: cover; background-position: center; margin: 0 auto 8px auto;"></div>` :
                `<div style="width: 60px; height: 60px; border-radius: 50%; background: #a65b32; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin: 0 auto 8px auto;">${kisiAdi.charAt(0).toUpperCase()}</div>`;

            let takipBtnModal = "";
            if(aktifKullanici !== "Misafir" && aktifKullanici !== kisiAdi) {
                let takipEdiliyorMu = JSON.parse(localStorage.getItem("sanart_takip_edilenler_" + aktifKullanici) || "[]").includes(kisiAdi);
                let btnText = takipEdiliyorMu ? 'Takip Ediliyor' : 'Takip Et';
                let btnBg = takipEdiliyorMu ? '#7a6555' : '#a65b32';
                takipBtnModal = `<button class="takip-btn-${kisiAdi}" onclick="takipEtDegistir('${kisiAdi}', this); setTimeout(() => kullaniciProfiliAc('${kisiAdi}'), 50);" style="background: ${btnBg}; color: white; border: none; padding: 6px 16px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; font-weight: bold; display: block; margin-left: auto; margin-right: auto;">${btnText}</button>`;
            }

            let istatistikHTML = `<div style="display: flex; justify-content: space-around; background: #f0ebe1; padding: 8px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #bfa487; font-size: 12px;">`;
            
            if (!gizlilikAyarlari.eser) {
                istatistikHTML += `<div><strong>${kullaniciEserleri.length}</strong><br><span style="font-size: 10px; color: #7a6555;">Eser</span></div>`;
            }
            if (!gizlilikAyarlari.begeni) {
                istatistikHTML += `<div><strong>${toplamBegeni}</strong><br><span style="font-size: 10px; color: #7a6555;">Beğeni</span></div>`;
            }
            if (!gizlilikAyarlari.takipci) {
                istatistikHTML += `<div onclick="listeGoster('Takipçiler', ${JSON.stringify(takipciler)}, ${gizlilikAyarlari.takipciGizli || false})" style="cursor: pointer;"><strong>${takipciler.length}</strong><br><span style="font-size: 10px; color: #a65b32; text-decoration: underline;">Takipçi</span></div>`;
            }
            if (!gizlilikAyarlari.takip) {
                istatistikHTML += `<div onclick="listeGoster('Takip Edilenler', ${JSON.stringify(takipEdilenler)}, ${gizlilikAyarlari.takipGizli || false})" style="cursor: pointer;"><strong>${takipEdilenler.length}</strong><br><span style="font-size: 10px; color: #a65b32; text-decoration: underline;">Takip</span></div>`;
            }
            istatistikHTML += `</div>`;

            let eserlerGridHTML = "";
            if(!gizlilikAyarlari.eser) {
                if(kullaniciEserleri.length > 0) {
                    kullaniciEserleri.forEach(e => {
                        if(e.gorsel) {
                            eserlerGridHTML += `<img src="${e.gorsel}" onclick="eserDetayGoster('${e.id}')" style="width: 100%; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #bfa487; cursor: pointer;">`;
                        }
                    });
                } else {
                    eserlerGridHTML = `<p style="grid-column: span 3; font-size: 11px; color: #7a6555; font-style: italic; text-align: center;">Henüz eser paylaşmamış.</p>`;
                }
            } else {
                eserlerGridHTML = `<p style="grid-column: span 3; font-size: 11px; color: #7a6555; font-style: italic; text-align: center;">Bu kullanıcının eserleri gizli.</p>`;
            }

            modalIcerik.innerHTML = `
                <div style="text-align: center;">
                    ${avatarHTML}
                    <h3 style="color: #2c221e; margin-bottom: 4px; font-size: 15px;">${kisiAdi}</h3>
                    ${takipBtnModal}
                    ${istatistikHTML}
                    <h4 style="font-size: 12px; color: #2b2201; margin-bottom: 6px; text-align: left;">Paylaştığı Eserler:</h4>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 180px; overflow-y: auto;">
                        ${eserlerGridHTML}
                    </div>
                </div>
            `;

            document.getElementById('profilDetayModal').style.display = 'flex';
        }

        function profilModaliniKapat() {
            document.getElementById('profilDetayModal').style.display = 'none';
        }

        function eserDetayGoster(eserId) {
            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let eser = eserler.find(e => String(e.id) === String(eserId));
            if(!eser) return;

            let aktifKullanici = localStorage.getItem("sanart_kullanici") || "Misafir";
            let begenenler = eser.begenenler || [];
            let begenildiMi = begenenler.includes(aktifKullanici);

            let yorumlarHTML = "";
            if (eser.yorumlar && eser.yorumlar.length > 0) {
                eser.yorumlar.forEach(y => {
                    yorumlarHTML += `<div style="font-size: 12px; color: #7a6555; margin-bottom: 4px;"><strong>${y.yazar}:</strong> ${y.metin}</div>`;
                });
            } else {
                yorumlarHTML = `<p style="font-size: 12px; color: #a08c7d; font-style: italic;">Henüz yorum yapılmamış.</p>`;
            }

            let alan = document.getElementById('eserDetayIcerik');
            alan.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <span style="font-size: 13px; font-weight: bold; color: #2c221e; cursor: pointer;" onclick="kullaniciProfiliAc('${eser.yazar}')">${eser.yazar}</span>
                    <span style="font-size: 11px; color: #7a6555;">${eser.tarih || 'Bugün'}</span>
                </div>
                <div style="width: 100%; background: #f0ebe1; border-radius: 6px; overflow: hidden; border: 1px solid #bfa487; margin-bottom: 10px;">
                    <img src="${eser.gorsel}" style="width: 100%; display: block;">
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #eae0d0; padding-bottom: 6px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <span style="cursor: pointer; font-size: 18px;" onclick="begeniDegistirModal(this, '${eser.id}')">${begenildiMi ? '❤️' : '🤍'}</span>
                            <strong class="begeni-sayisi-modal" style="font-size: 12px; color: #2c221e;">${begenenler.length}</strong>
                        </div>
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <span style="font-size: 18px;">💬</span>
                            <strong style="font-size: 12px; color: #2c221e;">${eser.yorumlar ? eser.yorumlar.length : 0}</strong>
                        </div>
                    </div>
                </div>
                <p style="font-size: 13px; margin-bottom: 10px; color: #2c221e; text-align: left;">
                    <strong>${eser.baslik || ''}</strong> ${eser.aciklama ? '- ' + eser.aciklama : ''} <span style="color: #a65b32; font-weight: bold;">#${eser.etiket || 'diğer'}</span>
                </p>
                <div style="border-top: 1.5px dashed #bfa487; padding-top: 8px; text-align: left;">
                    <div style="max-height: 100px; overflow-y: auto; margin-bottom: 8px;">${yorumlarHTML}</div>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="modalYorumInput" placeholder="Yorum yaz..." style="flex: 1; padding: 5px; font-size: 12px; border: 1px solid #bfa487; border-radius: 4px; font-family: 'Georgia', serif;">
                        <button onclick="modalYorumYap('${eser.id}')" style="padding: 5px 10px; font-size: 11px; background: #a65b32; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Paylaş</button>
                    </div>
                </div>
            `;
            document.getElementById('eserDetayModal').style.display = 'flex';
        }

        function begeniDegistirModal(element, eserId) {
            let kullanici = localStorage.getItem("sanart_kullanici");
            if (!kullanici || kullanici === "Misafir") {
                document.getElementById('girisModal').style.display = 'flex';
                return;
            }
            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let eser = eserler.find(e => String(e.id) === String(eserId));
            if (!eser) return;

            if (!eser.begenenler) eser.begenenler = [];
            let userIndex = eser.begenenler.indexOf(kullanici);
            let sayiElementi = element.closest('#eserDetayModal').querySelector('.begeni-sayisi-modal');

            if (userIndex > -1) {
                eser.begenenler.splice(userIndex, 1);
                element.innerText = "🤍";
            } else {
                eser.begenenler.push(kullanici);
                element.innerText = "❤️";
            }
            sayiElementi.innerText = eser.begenenler.length;
            localStorage.setItem("sanart_eserler", JSON.stringify(eserler));
            gonderileriYukle();
        }

        function modalYorumYap(eserId) {
            let kullanici = localStorage.getItem("sanart_kullanici");
            if (!kullanici || kullanici === "Misafir") {
                document.getElementById('girisModal').style.display = 'flex';
                return;
            }
            let input = document.getElementById('modalYorumInput');
            let metin = input.value.trim();
            if(!metin) return;

            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let eser = eserler.find(e => String(e.id) === String(eserId));
            if(!eser) return;

            if(!eser.yorumlar) eser.yorumlar = [];
            eser.yorumlar.push({ yazar: kullanici, metin: metin });
            localStorage.setItem("sanart_eserler", JSON.stringify(eserler));
            eserDetayGoster(eserId);
            gonderileriYukle();
        }

        function listeGoster(baslik, liste, gizliMi) {
            if (gizliMi) {
                alert("Bu kullanıcının listesi gizli.");
                return;
            }
            document.getElementById('listeBaslik').innerText = baslik + ` (${liste.length})`;
            let alan = document.getElementById('listeIcerikAlani');
            alan.innerHTML = "";
            if(liste.length === 0) {
                alan.innerHTML = `<p style="font-size: 12px; color: #7a6555; font-style: italic;">Liste boş.</p>`;
            } else {
                liste.forEach(kisi => {
                    alan.innerHTML += `<div onclick="kullaniciProfiliAc('${kisi}')" style="padding: 6px 10px; background: #f0ebe1; border: 1px solid #bfa487; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; color: #2c221e;">👤 ${kisi}</div>`;
                });
            }
            document.getElementById('listeDetayModal').style.display = 'flex';
        }

        function takipEtDegistir(sanatciAdi, btnElement) {
            let aktifKullanici = localStorage.getItem("sanart_kullanici");
            if (!aktifKullanici || aktifKullanici === "Misafir") {
                document.getElementById('girisModal').style.display = 'flex';
                return;
            }

            let key = "sanart_takip_edilenler_" + aktifKullanici;
            let takipEdilenler = JSON.parse(localStorage.getItem(key) || "[]");
            let index = takipEdilenler.indexOf(sanatciAdi);

            let yeniDurum = false;
            if (index > -1) {
                takipEdilenler.splice(index, 1);
                yeniDurum = false;
            } else {
                takipEdilenler.push(sanatciAdi);
                yeniDurum = true;
            }

            localStorage.setItem(key, JSON.stringify(takipEdilenler));

            let ilgiliButonlar = document.querySelectorAll('.takip-btn-' + CSS.escape(sanatciAdi));
            ilgiliButonlar.forEach(btn => {
                btn.innerText = yeniDurum ? "Takip Ediliyor" : "Takip Et";
                btn.style.background = yeniDurum ? "#7a6555" : "#a65b32";
            });

            if(btnElement) {
                btnElement.innerText = yeniDurum ? "Takip Ediliyor" : "Takip Et";
                btnElement.style.background = yeniDurum ? "#7a6555" : "#a65b32";
            }
        }

        function begeniDegistir(element, eserId) {
            let kullanici = localStorage.getItem("sanart_kullanici");
            if (!kullanici || kullanici === "Misafir") {
                document.getElementById('girisModal').style.display = 'flex';
                return;
            }

            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let eser = eserler.find(e => String(e.id) === String(eserId));
            if (!eser) return;

            if (!eser.begenenler) eser.begenenler = [];
            let userIndex = eser.begenenler.indexOf(kullanici);
            let sayiElementi = element.closest('.card').querySelector('.begeni-sayisi');

            if (userIndex > -1) {
                eser.begenenler.splice(userIndex, 1);
                element.innerText = "🤍";
            } else {
                eser.begenenler.push(kullanici);
                element.innerText = "❤️";
            }

            sayiElementi.innerText = eser.begenenler.length;
            localStorage.setItem("sanart_eserler", JSON.stringify(eserler));
        }

        function yorumlariAcKapat(element) {
            var kart = element.closest('.card');
            var yorumBolumu = kart.querySelector('.yorum-alani');
            yorumBolumu.style.display = yorumBolumu.style.display === "none" ? "block" : "none";
        }

        function yorumYap(buttonElement, eserId) {
            let kullanici = localStorage.getItem("sanart_kullanici");
            if (!kullanici || kullanici === "Misafir") {
                document.getElementById('girisModal').style.display = 'flex';
                return;
            }

            var kart = buttonElement.closest('.card');
            var input = kart.querySelector('.yorum-input');
            var yorumMetni = input.value.trim();
            if (yorumMetni === "") return;

            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let eser = eserler.find(e => String(e.id) === String(eserId));
            if (!eser) return;

            if (!eser.yorumlar) eser.yorumlar = [];
            eser.yorumlar.push({ yazar: kullanici, metin: yorumMetni });

            localStorage.setItem("sanart_eserler", JSON.stringify(eserler));
            gonderileriYukle();
        }

        function yoneticiEserSil(eserId) {
            if(!confirm("Bu eseri silmek istediğine emin misin?")) return;
            let eserler = JSON.parse(localStorage.getItem("sanart_eserler") || "[]");
            let yeniListe = eserler.filter(e => String(e.id) !== String(eserId));
            localStorage.setItem("sanart_eserler", JSON.stringify(yeniListe));
            gonderileriYukle();
        }
    </script>
